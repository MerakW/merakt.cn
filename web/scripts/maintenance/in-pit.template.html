:root{
  --bg:#10151B; --ink:#F2F4F6; --ink-2:#A9B3BD; --red:#E10600;
  --text:"Formula1 Text",system-ui,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;
  --pad:48px; --ease:cubic-bezier(.2,.7,.1,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
::selection{background:var(--red);color:#fff}

.screen{position:relative;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr;gap:32px;padding:28px var(--pad) 40px;overflow:hidden;isolation:isolate}
/* the red halftone field. CSS fallback first, WebGL canvas on top when available */
.field{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,transparent 56%,rgba(225,6,0,.18) 72%,rgba(190,8,16,.85) 100%)}
.field::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--bg) 38%,transparent 40%) 0 0/8px 8px;opacity:.55}
.gl .field{display:none}
#halftone{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.screen::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 82%,rgba(0,0,0,.4))}

/* top: language + broadcast bug */
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;position:relative;z-index:3}
.lang{height:40px;min-width:52px;padding:0 14px;border:0;border-radius:2px;background:rgba(255,255,255,.08);color:var(--ink);font-weight:600;font-size:14px;letter-spacing:.06em;cursor:pointer;transition:background .2s}
.lang:hover{background:rgba(255,255,255,.16)}
.bug{display:block;text-decoration:none}
.intro .bug{opacity:0}
/* the big mark used only during the intro: rendered at full size so it stays sharp */
.splash{position:fixed;left:50%;top:50%;z-index:5;margin:0;pointer-events:none;transform:translate(-50%,-50%) scale(1);transform-origin:center;opacity:0;font-size:clamp(56px,10vw,150px)}
.splash .mark{font-size:1em}
.no-intro .splash{display:none}
.mark{font-family:"Archivo",sans-serif;display:block;font-weight:900;font-stretch:125%;font-size:26px;line-height:1;letter-spacing:-.01em;transform:skewX(-12deg);white-space:nowrap}

/* hero */
.hero{align-self:center;max-width:min(760px,58vw);position:relative;z-index:2}
.headline{font-family:"Formula1 Recovery",sans-serif;margin:0 0 22px;font-weight:900;font-stretch:normal;font-size:clamp(64px,11.2vw,176px);line-height:.84;letter-spacing:-.015em;white-space:nowrap;display:inline-block;position:relative;z-index:2}
.heading{margin:0 0 10px;font-weight:600;font-size:clamp(22px,2.3vw,32px);line-height:1.3;letter-spacing:-.005em}
.desc{margin:0 0 26px;color:var(--ink-2);font-size:clamp(16px,1.25vw,18px);max-width:34em}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px 30px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:56px;padding:0 26px 0 22px;border-radius:2px;background:var(--ink);color:var(--bg);font-weight:600;font-size:17px;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.btn svg{width:20px;height:20px;flex:none}
.btn:hover{background:var(--red);color:#fff}
.btn:active{transform:translateY(1px)}
.btn[aria-busy="true"]{background:var(--red);color:#fff;pointer-events:none}
.btn[aria-busy="true"] svg{animation:spin .9s linear infinite}
.btn.nudge{animation:nudge .4s var(--ease)}
.link[hidden]{display:none}
.link{display:inline-flex;align-items:center;gap:10px;font-weight:600;text-decoration:none;padding:6px 0;border-bottom:2px solid var(--ink);line-height:1.2}
.link svg{width:14px;height:14px;transition:transform .2s var(--ease)}
.link:hover{border-color:var(--red)}
.link:hover svg{transform:translate(2px,-2px)}
.radio{margin:16px 0 0;font-size:15px;color:var(--ink-2);min-height:1.5em;font-variant-numeric:tabular-nums}

/* kicker + timing */
.kicker{display:flex;align-items:center;gap:10px;margin:0 0 22px;font-size:14px;font-weight:600;letter-spacing:.08em;color:var(--ink-2)}
.kicker::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(225,6,0,.6);animation:beat 2.4s ease-out infinite}
[data-state="back"] .kicker::before{background:#1FA34A;animation:none}
.timing{display:flex;gap:0;margin:0 0 34px;padding:0;list-style:none}
.timing li{display:grid;gap:4px;padding:2px 28px 2px 16px;border-left:3px solid var(--red)}
.timing li+li{border-left-color:rgba(255,255,255,.22)}
.timing span{font-size:13px;color:var(--ink-2);letter-spacing:.02em}
.timing strong{font-weight:600;font-stretch:normal;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* speed stripes for the pit-exit wipe */
.stripes{position:absolute;left:0;right:0;height:0;z-index:1;pointer-events:none}
.stripes i{position:absolute;left:0;width:100%;background:var(--red);transform:scaleX(0);transform-origin:left}
.stripes i:nth-child(1){height:var(--sh,64px);top:calc(var(--sh,64px) * -.62)}
.stripes i:nth-child(2){height:calc(var(--sh,64px) * .16);top:calc(var(--sh,64px) * .5)}
.stripes.go i{animation:stripe .95s cubic-bezier(.6,0,.2,1) forwards}
.stripes.go i:nth-child(2){animation-delay:.07s}

/* entrance choreography */
.js .rise{opacity:0;transform:translateY(14px)}
.ready .rise{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--d,0) * 1ms)}
.swap{animation:swap .5s var(--ease) both}

@keyframes beat{0%{box-shadow:0 0 0 0 rgba(225,6,0,.6)}70%,100%{box-shadow:0 0 0 10px rgba(225,6,0,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-5px)}65%{transform:translateX(4px)}}
@keyframes swap{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes stripe{0%{transform:scaleX(0);transform-origin:left}45%{transform:scaleX(1);transform-origin:left}55%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}

@media (max-width:900px){.hero{max-width:none}}
@media (max-width:720px){
  :root{--pad:20px}
  .screen{padding-top:18px;gap:24px}
  .mark{font-size:22px}
  .hero{align-self:start;padding-top:8vh}
  .headline{font-size:clamp(52px,19vw,120px);margin-bottom:18px}
  .desc{margin-bottom:26px}
  .actions{flex-direction:column;align-items:stretch;gap:18px}
  .btn{width:100%}.link{align-self:flex-start}
  .timing{margin-bottom:28px}
  .timing li{padding-right:20px}
  .timing strong{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0ms!important}
}
</style>
</head>

    "maintenance.pitTime": "进站时长",
    "maintenance.exit": "预计出站",
    "maintenance.tbc": "待定",
    "maintenance.soon": "即将出站",
    "maintenance.lang": "EN",
    "maintenance.langLabel": "Switch to English",
    "common.reconnect": "重新连接",
    "common.checking": "正在重新连接…",
    "common.back": "回到 MERAK"
  },
  "en": {
    "maintenance.title": "IN PIT · Merak",
    "maintenance.headline": "IN PIT.",
    "maintenance.headlineBack": "PIT EXIT.",
    "maintenance.heading": "In the pits. Back on track soon.",
    "maintenance.headingBack": "Out of the pits. Back on track.",
    "maintenance.description": "Service temporarily unavailable. An update or recovery may be in progress.",
    "maintenance.descriptionBack": "Service restored. Taking you back to MERAK…",
    "maintenance.code": "HTTP 503 · Service unavailable",
    "maintenance.codeBack": "Service restored",
    "maintenance.status": "Check service status",
    "maintenance.auto": "Reconnecting automatically in {s}s",
    "maintenance.stillOut": "Still in the pit lane. Not back yet — try again shortly.",
    "maintenance.offline": "Your device looks offline. Check your own connection first.",
    "maintenance.backRadio": "Reloading now.",
    "maintenance.pitTime": "Time in pit",
    "maintenance.exit": "Expected exit",
    "maintenance.tbc": "TBC",
    "maintenance.soon": "Any minute",
    "maintenance.lang": "中文",
    "maintenance.langLabel": "切换到中文",
    "common.reconnect": "Reconnect",
    "common.checking": "Reconnecting…",
    "common.back": "Back to MERAK"
  }
};
</script>
<script>
/* ============================================================
   MERAK · HTTP 503 maintenance page — "IN PIT" broadcast slate
   ============================================================ */
var CONFIG = {
  manual: false,
  preview: false,
  statusUrl: "https://status.merakt.cn/status/home",
  probeUrl: "/",                 // checked to see whether the site is back
  retrySeconds: 30,
  maxRetrySeconds: 120,
  startedAt: null,               // ISO time the stop began; null = when the visitor first saw this page
  expectedExit: null             // ISO expected return, e.g. "2026-10-19T09:30:00+08:00"; null = TBC
};

(() => {
  const root = document.documentElement;
  root.classList.add("js");
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const M = window.MERAK_MESSAGES;
  $("admin-entry").hidden = !CONFIG.manual;
  $("status").href = CONFIG.statusUrl;
  $("reconnect").href = CONFIG.probeUrl;
  const store = (k, v) => { try { return v === undefined ? sessionStorage.getItem(k) : sessionStorage.setItem(k, v); } catch (e) { return null; } };

  // Rearm the normal site entrance for every way out of the pit page.
  try { sessionStorage.removeItem("merak-site-arrival"); sessionStorage.setItem("merak-recovery-arrival", "1"); } catch (e) {}

  /* ---------- language (shared merak-locale cookie) ---------- */
  function readLang() {
    const q = params.get("lang");
    if (q) return /^en/i.test(q) ? "en" : "zh-CN";
    const c = document.cookie.match(/(?:^|; )merak-locale=([^;]*)/);
    if (c) return /^en/i.test(decodeURIComponent(c[1])) ? "en" : "zh-CN";
    const l = (navigator.languages || [navigator.language]).find(x => /^(en|zh)(-|$)/i.test(x || "")) || "zh-CN";
    return /^en/i.test(l) ? "en" : "zh-CN";
  }
  let lang = readLang();
  const T = (k, v) => { let s = (M[lang] && M[lang][k]) ?? M["zh-CN"][k] ?? ""; if (v) for (const n in v) s = s.split("{" + n + "}").join(v[n]); return s; };
  const fmt = (d, o) => new Intl.DateTimeFormat(lang === "en" ? "en-GB" : "zh-CN", o).format(d);
  const hm = d => fmt(d, { hour: "2-digit", minute: "2-digit", hour12: false });

  const seen = (() => {
    if (CONFIG.startedAt) return new Date(CONFIG.startedAt);
    const v = +store("merak-pit-seen");
    if (v && Date.now() - v < 864e5) return new Date(v);
    store("merak-pit-seen", String(Date.now()));
    return new Date();
  })();
  const exit = CONFIG.expectedExit ? new Date(CONFIG.expectedExit) : null;

  let state = "out", stopped = 0, busy = false, delay = CONFIG.retrySeconds, nextAt = Date.now() + delay * 1000, note = null, noteUntil = 0;
  if (CONFIG.manual && exit) nextAt = Math.min(nextAt, exit.getTime());
  const setState = s => { state = s; root.dataset.state = s; };

  /* ---------- text ---------- */
  function render(animate) {
    const back = state === "back";
    root.lang = lang;
    document.title = T("maintenance.title");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = T(el.dataset.i18n); });
    $("headline").textContent = T(back ? "maintenance.headlineBack" : "maintenance.headline");
    $("heading").textContent = T(back ? "maintenance.headingBack" : "maintenance.heading");
    $("desc").textContent = T(back ? "maintenance.descriptionBack" : CONFIG.manual ? "maintenance.manualDescription" : "maintenance.description");
    $("code").textContent = T(back ? "maintenance.codeBack" : CONFIG.manual ? "maintenance.manualCode" : "maintenance.code");
    $("reconnect").querySelector("span").textContent = T(back ? "common.back" : busy ? "common.checking" : "common.reconnect");
    const b = $("lang"); b.textContent = T("maintenance.lang"); b.setAttribute("aria-label", T("maintenance.langLabel")); b.lang = lang === "en" ? "zh-CN" : "en";
    if (animate) ["headline", "heading", "desc"].forEach((id, i) => { const el = $(id); el.classList.remove("swap"); void el.offsetWidth; el.style.animationDelay = i * 70 + "ms"; el.classList.add("swap"); });
    tick(); radio(); fit();
  }
  function fit() {
    const h = $("headline"); h.style.fontSize = "";
    const avail = $("hero").clientWidth || h.parentElement.clientWidth;
    if (h.offsetWidth > avail) h.style.fontSize = parseFloat(getComputedStyle(h).fontSize) * avail / h.offsetWidth * 0.98 + "px";
  }
  addEventListener("resize", fit);
  document.fonts && document.fonts.ready.then(fit);
  $("lang").addEventListener("click", () => {
    lang = lang === "en" ? "zh-CN" : "en";
    document.cookie = `merak-locale=${lang}; path=/; max-age=31536000; SameSite=Lax`;
    render(true);
  });

  const pad = n => String(n).padStart(2, "0");
  function tick() {
    const now = Date.now(), s = Math.max(0, Math.floor(((stopped || now) - seen) / 1000));
    $("pit-time").textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
    $("pit-exit").textContent = !exit ? T("maintenance.tbc") : exit <= now ? T("maintenance.soon")
      : (exit.toDateString() === new Date(now).toDateString() ? "" : fmt(exit, { month: "short", day: "numeric" }) + " ") + hm(exit);
  }
  /* ---------- reconnect ---------- */
  function radio() {
    const el = $("radio");
    if (state === "back") { el.textContent = T("maintenance.backRadio"); return; }
    if (busy) { el.textContent = ""; return; }
    if (note && Date.now() < noteUntil) { el.textContent = T(note); return; }
    el.textContent = T("maintenance.auto", { s: Math.max(0, Math.ceil((nextAt - Date.now()) / 1000)) });
  }
  async function probe() {
    if (CONFIG.preview && params.get("preview") !== "back") return "out";
    if (params.get("preview") === "back") { await new Promise(r => setTimeout(r, 1200)); return "back"; }
    if (navigator.onLine === false) return "offline";
    try {
      const url = new URL(CONFIG.probeUrl, location.href);
      url.searchParams.set("_pitcheck", Date.now());
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(url, { cache: "no-store", credentials: "same-origin", signal: ctl.signal });
      clearTimeout(to);
      const ra = parseInt(r.headers.get("Retry-After"), 10);
      if (ra > 0) delay = Math.min(Math.max(ra, 10), CONFIG.maxRetrySeconds);
      if (r.status >= 500 || r.status === 429) return "out";
      const body = await r.text();
      return body.includes("data-merak-maintenance") ? "out" : "back";
    } catch (e) { return navigator.onLine === false ? "offline" : "out"; }
  }
  async function check(manual) {
    if (busy || state === "back") return;
    busy = true; setState("search"); render(false);
    const btn = $("reconnect"); btn.setAttribute("aria-busy", "true");
    field.search(true);
    const [res] = await Promise.all([probe(), new Promise(r => setTimeout(r, 1100))]);
    busy = false; btn.removeAttribute("aria-busy"); field.search(false);
    if (res === "back") return goBack();
    setState("out");
    if (manual) { btn.classList.remove("nudge"); void btn.offsetWidth; btn.classList.add("nudge"); }
    else delay = Math.min(Math.round(delay * 1.5), CONFIG.maxRetrySeconds);
    note = res === "offline" ? "maintenance.offline" : "maintenance.stillOut"; noteUntil = Date.now() + 5000;
    nextAt = Date.now() + delay * 1000;
    if (CONFIG.manual && exit && exit > Date.now()) nextAt = Math.min(nextAt, exit.getTime());
    render(false);
  }
  function goBack() {
    setState("back"); stopped = Date.now();
    store("merak-pit-seen", ""); store("merak-pit-intro", "");
    field.exit();
    const st = $("stripes"), h = $("headline");
    st.style.top = h.offsetTop + h.offsetHeight * 0.52 + "px";
    st.style.setProperty("--sh", h.offsetHeight * 0.34 + "px");
    st.style.left = -$("hero").getBoundingClientRect().left + "px"; st.style.right = "auto"; st.style.width = innerWidth + "px";
    setTimeout(() => { st.classList.remove("go"); void st.offsetWidth; st.classList.add("go"); }, reduce ? 0 : 520);
    setTimeout(() => render(true), reduce ? 0 : 760);
    $("reconnect").querySelector("svg").style.display = "none";
    if (params.get("preview") !== "back") setTimeout(() => location.reload(), 2600);
  }
  $("reconnect").addEventListener("click", e => { if (state === "back") return; e.preventDefault(); check(true); });
  addEventListener("online", () => check(false));
  setInterval(() => {
    tick();
    if (!busy && state === "out" && Date.now() >= nextAt && !document.hidden) check(false);
    radio();
  }, 1000);

  /* ---------- intro: red bars flood in, the MERAK mark settles into the corner ---------- */
  const quick = reduce || (!params.has("intro") && store("merak-pit-intro") === "1");
  store("merak-pit-intro", "1");
  const bug = $("bug"), splash = $("splash");
  if (quick) root.classList.add("no-intro");
  else {
    root.classList.add("intro");
    setTimeout(() => { splash.style.transition = "opacity .25s"; splash.style.opacity = "1"; }, 380);
    setTimeout(() => {   // fly the big mark into the corner, then hand over to the real one
      const a = splash.getBoundingClientRect(), b = bug.getBoundingClientRect(), k = b.width / a.width;
      splash.style.transition = "transform 1s cubic-bezier(.7,0,.15,1)";
      splash.style.transform = `translate(calc(-50% + ${b.left + b.width / 2 - innerWidth / 2}px), calc(-50% + ${b.top + b.height / 2 - innerHeight / 2}px)) scale(${k})`;
    }, 1250);
    setTimeout(() => { root.classList.remove("intro"); root.classList.add("no-intro"); }, 2280);
  }
  setTimeout(() => root.classList.add("ready"), quick ? (reduce ? 0 : 150) : 1650);

  /* ---------- the halftone field (WebGL) ---------- */
  const field = (() => {
    const api = { search() {}, exit() {} };
    const cv = $("halftone");
    const gl = cv.getContext("webgl", { antialias: false, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: false });
    if (!gl) return api;
    const vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
    const fs = `precision highp float;
uniform vec2 R;uniform float C,PT,BT,RP,RW,RA,CUT,CA,SE,ST,SU,SA,BR,TM,TT,BA;
float h1(float n){return fract(sin(n*127.1+31.7)*43758.5453);}
void main(){
  vec2 px=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);
  vec2 cc=(floor(px/C)+.5)*C;
  float d=length(px-cc)/C;
  vec2 q=cc/R; float u=mix(q.x,q.y,PT), v=mix(q.y,q.x,PT);
  float nb=mix(16.,10.,PT); float band=floor(v*nb); float bc=(band+.5)/nb;
  float hA=h1(band), hB=h1(band+19.), hC=h1(band+53.);
  float chev=1.-abs(bc-.5)*2.;
  /* intro bars shooting in from the near edge */
  float L=(BT-hA*.22)*3.4;
  float Ib=BT<0.?1.:clamp((L-u)/.2,0.,1.);
  /* the ramp: navy on the near side, red on the far side, stepped while it moves */
  float ext=SE*pow(max(0.,sin(ST*(2.+hB*1.6)+hC*6.283)),3.)*(.12+.2*hA);
  float pr=RP+RA*(.65*chev+.35*hB)-ext;
  float Ir=clamp((u-(pr-RW))/RW,0.,1.);
  /* outro: the far side is eaten back, stepped */
  float cut=CUT-CA*(.7*chev+.3*hC);
  float I=min(Ib,Ir)*step(u,cut);
  I=pow(I,1.25);
  /* breathing: a slow swell of the whole field plus a pulse that rolls through the dots */
  float wave=sin(u*9.-TT*1.9+v*1.5);
  float mid=I*(1.-I)*4.;
  I=clamp(I*(1.+BA*(.22*sin(TT*1.45)))+BA*.2*wave*mid,0.,1.);
  float r=.5*sqrt(I)*1.18*(1.+BA*.12*wave);
  float aa=1.2/C;
  float dot=smoothstep(r+aa,r-aa,d);
  float solid=smoothstep(.82,.98,I);
  float vig=1.-.32*pow(abs(v-.5)*2.,2.4);
  vec3 red=vec3(.882,.024,.0)*BR*vig;
  float a=max(dot,solid)*(.55+.45*I)+I*I*.28;
  /* hairline seam, like a dropped row in the decoder */
  float sx=SU*mix(R.x,R.y,PT);
  float seam=SA*step(abs(mix(px.x,px.y,PT)-sx),.75)*step(.35,h1(floor(v*40.)+TM));
  a=clamp(max(a,seam*.9),0.,1.);
  gl_FragColor=vec4(red*a,a);
}`;
    const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; };
    let pg;
    try { pg = gl.createProgram(); gl.attachShader(pg, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pg, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pg); if (!gl.getProgramParameter(pg, gl.LINK_STATUS)) throw 0; }
    catch (e) { return api; }
    gl.useProgram(pg);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pg, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {}; ["R", "C", "PT", "BT", "RP", "RW", "RA", "CUT", "CA", "SE", "ST", "SU", "SA", "BR", "TM", "TT", "BA"].forEach(n => U[n] = gl.getUniformLocation(pg, n));
    root.classList.add("gl");

    let W = 0, H = 0, dpr = 1, portrait = 0;
    function size() {
      dpr = Math.min(2, devicePixelRatio || 1);
      const r = cv.getBoundingClientRect(); W = Math.max(1, Math.round(r.width * dpr)); H = Math.max(1, Math.round(r.height * dpr));
      cv.width = W; cv.height = H; gl.viewport(0, 0, W, H);
      portrait = r.width / r.height < 0.9 ? 1 : 0;
      if (reduce) frame(performance.now());
    }
    const ease = x => x < 0 ? 0 : x > 1 ? 1 : 1 - Math.pow(1 - x, 3);
    const inout = x => x < 0 ? 0 : x > 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    const T0 = performance.now() - (quick ? 1250 : 0);
    const FZ = params.has("t") ? +params.get("t") : -1; // QA: freeze the field at a moment of the intro
    let searching = false, sEnv = 0, sT = 0, exitAt = 0, seamAt = T0 + 4200, seamU = 0, seamUntil = 0, last = T0;

    function frame(now) {
      const t = reduce ? 9 : FZ >= 0 ? FZ : (now - T0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
      const rw0 = portrait ? 0.36 : 0.4;
      // intro
      const bt = quick ? -1 : t;
      const k = quick && reduce ? 1 : ease((t - 1.25) / 1.25);
      let rp = t < 1.25 ? -2 : -0.2 + 1.2 * k;
      const ba = reduce ? 0 : k * (exitAt ? 0 : 1);
      let rw = (0.75 - (0.75 - rw0) * k) + 0.07 * Math.sin(t * 1.45) * ba;
      let ra = 0.3 * Math.sin(Math.PI * k);
      // search: bars reach out of the red side
      sEnv += ((searching ? 1 : 0) - sEnv) * Math.min(1, dt * 6); sT += dt * (0.6 + sEnv);
      // exit: the red is eaten back, stepped
      let cut = 2, ca = 0;
      if (exitAt) { const e = reduce ? 1 : inout((now - exitAt) / 900); cut = 1.05 - e * (rw + 0.15); ca = 0.22 * Math.sin(Math.PI * Math.min(1, e * 1.1)); if (e >= 1) cut = -1; }
      // seam flicker
      let sa = 0;
      if (!reduce && !exitAt && t > 3) {
        if (now > seamAt) { seamU = 1 - rw * (0.25 + Math.random() * 0.5); seamUntil = now + 380 + Math.random() * 300; seamAt = now + 4500 + Math.random() * 5000; }
        if (now < seamUntil) sa = Math.random() > 0.3 ? 1 : 0;
      }
      const cell = Math.round(Math.max(5, Math.min(9, (W / dpr) / 180)) * dpr);
      gl.uniform2f(U.R, W, H); gl.uniform1f(U.C, cell); gl.uniform1f(U.PT, portrait);
      gl.uniform1f(U.BT, bt); gl.uniform1f(U.RP, rp); gl.uniform1f(U.RW, rw); gl.uniform1f(U.RA, ra);
      gl.uniform1f(U.CUT, cut); gl.uniform1f(U.CA, ca); gl.uniform1f(U.SE, sEnv); gl.uniform1f(U.ST, sT);
      gl.uniform1f(U.SU, seamU); gl.uniform1f(U.SA, sa);
      gl.uniform1f(U.BR, (t < 1.25 ? 1 : 1 - 0.2 * k) * (1 + 0.1 * Math.sin(t * 1.45) * ba)); gl.uniform1f(U.TT, t); gl.uniform1f(U.BA, ba); gl.uniform1f(U.TM, Math.floor(now / 90) % 97);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    function loop(now) { if (!document.hidden) frame(now); if (!reduce) requestAnimationFrame(loop); }
    addEventListener("resize", size); size();
    requestAnimationFrame(loop);
    api.search = on => { searching = on; if (reduce) frame(performance.now()); };
    api.exit = () => { exitAt = performance.now(); if (reduce) frame(exitAt); };
    return api;
  })();

  render(false);
})();
</script>
