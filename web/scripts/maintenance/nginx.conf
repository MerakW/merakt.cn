# Add inside the existing application proxy location, retaining its proxy_pass:
# proxy_intercept_errors on;
# error_page 502 504 =503 /__maintenance.html;

# Add inside the same server block. The path must be readable inside OpenResty.
location = /__maintenance.html {
    internal;
    alias /opt/merak/maintenance/in-pit.html;
    default_type text/html;
    add_header Retry-After 30 always;
    add_header Cache-Control "no-store" always;
}
